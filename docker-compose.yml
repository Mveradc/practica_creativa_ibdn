services:

  mongo:
    image: mongo:7.0.17
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./data:/data/import
    networks:
      - ibdn-net

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: "flight-cluster"
      CASSANDRA_NUM_TOKENS: 256
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 512M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ibdn-net

  cassandra-init:
    image: cassandra:4.1
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./resources/cassandra/init.cql:/tmp/init.cql
    command: cqlsh cassandra -f /tmp/init.cql
    networks:
      - ibdn-net

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ibdn-net

  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /bin/bash -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flight-delay-ml-request --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic flight-delay-ml-results --partitions 1 --replication-factor 1 &&
      echo 'Topics creados correctamente'
      "
    networks:
      - ibdn-net

  spark-master:
    build:
      context: ./flight_prediction
      dockerfile: Dockerfile
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ibdn-net

  spark-worker-1:
    build:
      context: ./flight_prediction
      dockerfile: Dockerfile
    container_name: spark-worker-1
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ibdn-net

  spark-worker-2:
    build:
      context: ./flight_prediction
      dockerfile: Dockerfile
    container_name: spark-worker-2
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ibdn-net

  spark-submit:
    build:
      context: ./flight_prediction
      dockerfile: Dockerfile
    container_name: spark-submit
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker-1:
        condition: service_healthy
      spark-worker-2:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      CASSANDRA_HOST: cassandra
      MONGO_URI: mongodb://mongo:27017
      BASE_PATH: /app
      SPARK_MASTER: spark://spark-master:7077
      SPARK_PACKAGES: com.datastax.oss:java-driver-core:4.17.0,org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1
    volumes:
      - ./models:/app/models
    networks:
      - ibdn-net
    # override CMD to run the job against the cluster
    command: >
      bash -c "spark-submit --packages $$SPARK_PACKAGES --master spark://spark-master:7077 --deploy-mode client --class es.upm.dit.ging.predictor.MakePrediction /app/flight_prediction.jar"

  flask:
    build:
      context: ./resources/web
      dockerfile: Dockerfile
    container_name: flask
    depends_on:
      kafka:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:9092
      CASSANDRA_HOST: cassandra
      MONGO_URI: mongodb://mongo:27017
      PROJECT_HOME: /app
    ports:
      - "5001:5001"
    networks:
      - ibdn-net

networks:
  ibdn-net:
    driver: bridge

volumes:
  mongo_data:
  cassandra_data:
