apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/component: init
    app.kubernetes.io/part-of: agile-data-science
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
        app.kubernetes.io/component: init
        app.kubernetes.io/part-of: agile-data-science
    spec:
      restartPolicy: OnFailure
      serviceAccountName: flight-prediction-sa
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://minio:9000/minio/health/live; do
                echo "Waiting for MinIO..."; sleep 5;
              done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: minio-init
          image: minio/mc:latest
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: flight-prediction-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flight-prediction-secrets
                  key: MINIO_SECRET_KEY
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} && \
              mc mb --ignore-existing local/lakehouse && \
              mc mb --ignore-existing local/mlflow && \
              mc anonymous set none local/lakehouse
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
