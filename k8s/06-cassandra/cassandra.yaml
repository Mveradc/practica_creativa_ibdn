apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-init-cql
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: agile-data-science
data:
  init.cql: |
    CREATE KEYSPACE IF NOT EXISTS agile_data_science
    WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};

    USE agile_data_science;

    CREATE TABLE IF NOT EXISTS origin_dest_distances (
        origin   TEXT,
        dest     TEXT,
        distance DOUBLE,
        PRIMARY KEY ((origin, dest))
    );

    CREATE TABLE IF NOT EXISTS flight_delay_ml_response (
        uuid         TEXT PRIMARY KEY,
        origin       TEXT,
        dest         TEXT,
        carrier      TEXT,
        flight_date  TEXT,
        dep_delay    DOUBLE,
        distance     DOUBLE,
        day_of_week  INT,
        day_of_year  INT,
        day_of_month INT,
        timestamp    TEXT,
        prediction   DOUBLE
    );
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra-headless
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: agile-data-science
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cassandra
  ports:
    - name: cql
      port: 9042
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: agile-data-science
spec:
  selector:
    app.kubernetes.io/name: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: agile-data-science
spec:
  serviceName: cassandra-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: agile-data-science
    spec:
      serviceAccountName: flight-prediction-sa
      containers:
        - name: cassandra
          image: cassandra:4.1
          ports:
            - name: cql
              containerPort: 9042
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: "flight-cluster"
            - name: CASSANDRA_NUM_TOKENS
              value: "256"
            - name: HEAP_NEWSIZE
              value: "128M"
            - name: MAX_HEAP_SIZE
              value: "512M"
          readinessProbe:
            exec:
              command:
                - cqlsh
                - -e
                - "describe keyspaces"
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - cqlsh
                - -e
                - "describe keyspaces"
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
  volumeClaimTemplates:
    - metadata:
        name: cassandra-data
        labels:
          app.kubernetes.io/name: cassandra
          app.kubernetes.io/part-of: agile-data-science
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gke-retain
        resources:
          requests:
            storage: 10Gi
