apiVersion: v1
kind: Service
metadata:
  name: flask
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: flask
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: agile-data-science
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: flask
  ports:
    - name: http
      port: 80
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: flask
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: agile-data-science
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flask
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: agile-data-science
    spec:
      serviceAccountName: flight-prediction-sa
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "Waiting for Kafka..."; sleep 5;
              done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: wait-for-cassandra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z cassandra 9042; do
                echo "Waiting for Cassandra..."; sleep 5;
              done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: flask
          image: us-central1-docker.pkg.dev/practica-creativa-494612/flight-prediction/flask-api:latest
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: flight-prediction-endpoints
                  key: KAFKA_BROKERS
            - name: KAFKA_TOPIC_REQUEST
              valueFrom:
                configMapKeyRef:
                  name: flight-prediction-endpoints
                  key: KAFKA_TOPIC_REQUEST
            - name: CASSANDRA_HOST
              valueFrom:
                configMapKeyRef:
                  name: flight-prediction-endpoints
                  key: CASSANDRA_HOST
            - name: CASSANDRA_KEYSPACE
              valueFrom:
                configMapKeyRef:
                  name: flight-prediction-endpoints
                  key: CASSANDRA_KEYSPACE
            - name: FLASK_ENV
              value: "production"
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
