# Standard Labels for Flight Prediction Stack
# Referencia: https://kubernetes.io/docs/concepts/overview/working-with-objects/common-labels/

# Etiquetas comunes en TODOS los recursos:
metadata:
  labels:
    app.kubernetes.io/name: flight-prediction           # Nombre de la aplicación
    app.kubernetes.io/instance: flight-prediction-prod  # Instancia única
    app.kubernetes.io/version: "1.0.0"                  # Versión del sistema
    app.kubernetes.io/component: "component-name"        # Componente (cassandra, kafka, etc)
    app.kubernetes.io/part-of: agile-data-science       # Sistema más amplio
    app.kubernetes.io/managed-by: kubectl               # Herramienta de gestión
    environment: production                             # Entorno

# Etiquetas específicas por componente:
# Cassandra:    app.kubernetes.io/component: cassandra
# Kafka:        app.kubernetes.io/component: kafka
# MinIO:        app.kubernetes.io/component: minio
# Spark:        app.kubernetes.io/component: spark
# Flask:        app.kubernetes.io/component: flask-api
# MLflow:       app.kubernetes.io/component: mlflow
# Airflow:      app.kubernetes.io/component: airflow
# PostgreSQL:   app.kubernetes.io/component: postgres