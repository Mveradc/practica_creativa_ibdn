apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: spark-worker
    app.kubernetes.io/component: spark
    app.kubernetes.io/part-of: agile-data-science
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-worker
        app.kubernetes.io/component: spark
        app.kubernetes.io/part-of: agile-data-science
    spec:
      serviceAccountName: flight-prediction-sa
      initContainers:
        - name: wait-for-spark-master
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z spark-master 7077; do
                echo "Waiting for Spark Master..."; sleep 5;
              done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: spark-worker
          image: us-central1-docker.pkg.dev/practica-creativa-494612/flight-prediction/spark-predictor:latest
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.worker.Worker
            - spark://spark-master:7077
          ports:
            - name: webui
              containerPort: 8081
          env:
            - name: SPARK_WORKER_OPTS
              value: "-Dspark.worker.cleanup.enabled=false"
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: ivy-cache
              mountPath: /nonexistent/.ivy2.5.2
      volumes:
        - name: ivy-cache
          emptyDir: {}
