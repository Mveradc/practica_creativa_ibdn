apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-submit
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: spark-submit
    app.kubernetes.io/component: spark
    app.kubernetes.io/part-of: agile-data-science
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-submit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-submit
        app.kubernetes.io/component: spark
        app.kubernetes.io/part-of: agile-data-science
    spec:
      serviceAccountName: flight-prediction-sa
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "Waiting for Kafka..."; sleep 5;
              done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: wait-for-cassandra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z cassandra 9042; do
                echo "Waiting for Cassandra..."; sleep 5;
              done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: wait-for-spark-master
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z spark-master 7077; do
                echo "Waiting for Spark Master..."; sleep 5;
              done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: spark-submit
          image: us-central1-docker.pkg.dev/practica-creativa-494612/flight-prediction/spark-predictor:latest
          command:
            - bash
            - -lc
            - |
              spark-submit \
                --master k8s://https://kubernetes.default.svc:443 \
                --deploy-mode cluster \
                --name make-prediction \
                --conf spark.kubernetes.container.image=us-central1-docker.pkg.dev/practica-creativa-494612/flight-prediction/spark-predictor:latest \
                --conf spark.kubernetes.container.image.pullPolicy=Always \
                --conf spark.kubernetes.namespace=flight-prediction \
                --conf spark.kubernetes.authenticate.driver.serviceAccountName=flight-prediction-sa \
                --conf spark.kubernetes.jars.avoidDownloadSchemes=local \
                --conf spark.kubernetes.submission.waitAppCompletion=true \
                --conf spark.scheduler.minRegisteredResourcesRatio=0 \
                --conf spark.scheduler.maxRegisteredResourcesWaitingTime=120s \
                --conf spark.executor.instances=1 \
                --executor-cores 1 \
                --executor-memory 1g \
                --driver-memory 1g \
                --class es.upm.dit.ging.predictor.MakePrediction \
                local:///app/flight_prediction.jar
          env:
            - name: SPARK_MASTER
              value: "spark://spark-master:7077"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5050"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio:9000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: flight-prediction-secrets
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: flight-prediction-secrets
                  key: MINIO_SECRET_KEY
          ports:
            - name: driver
              containerPort: 4040
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes: []
