apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: kafka-init
    app.kubernetes.io/component: init
    app.kubernetes.io/part-of: agile-data-science
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init
        app.kubernetes.io/component: init
        app.kubernetes.io/part-of: agile-data-science
    spec:
      restartPolicy: OnFailure
      serviceAccountName: flight-prediction-sa
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "Waiting for Kafka..."; sleep 5;
              done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: kafka-init
          image: apache/kafka:4.2.0
          command:
            - /bin/bash
            - -c
            - |
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create --if-not-exists \
                --topic flight-delay-ml-request \
                --partitions 1 \
                --replication-factor 1 && \
              /opt/kafka/bin/kafka-topics.sh \
                --bootstrap-server kafka:9092 \
                --create --if-not-exists \
                --topic flight-delay-ml-results \
                --partitions 1 \
                --replication-factor 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
