apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: mlops
    app.kubernetes.io/part-of: agile-data-science
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5050
      targetPort: 5050
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-ui
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: mlops
    app.kubernetes.io/part-of: agile-data-science
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5050
      targetPort: 5050
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: mlops
    app.kubernetes.io/part-of: agile-data-science
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/component: mlops
        app.kubernetes.io/part-of: agile-data-science
    spec:
      serviceAccountName: flight-prediction-sa
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -q -O- http://minio:9000/minio/health/live; do
                echo "Waiting for MinIO..."; sleep 5;
              done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.21.3
          command:
            - mlflow
            - server
            - --backend-store-uri
            - sqlite:///mlflow/mlflow.db
            - --default-artifact-root
            - s3://mlflow/artifacts
            - --host
            - "0.0.0.0"
            - --port
            - "5050"
          ports:
            - name: http
              containerPort: 5050
          env:
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio:9000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: flight-prediction-secrets
                  key: MINIO_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: flight-prediction-secrets
                  key: MINIO_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 40
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-data
