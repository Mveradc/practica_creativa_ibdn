apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: airflow-init
    app.kubernetes.io/component: init
    app.kubernetes.io/part-of: agile-data-science
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow-init
        app.kubernetes.io/component: init
        app.kubernetes.io/part-of: agile-data-science
    spec:
      restartPolicy: OnFailure
      serviceAccountName: flight-prediction-sa
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."; sleep 5;
              done
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: airflow-init
          image: apache/airflow:2.9.3
          command:
            - /bin/bash
            - -c
            - |
              airflow db migrate && \
              airflow users create \
                --username admin \
                --password admin \
                --firstname Admin \
                --lastname User \
                --role Admin \
                --email admin@example.com || true
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: "LocalExecutor"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://airflow:airflow@postgres/airflow"
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: flight-prediction-secrets
                  key: AIRFLOW__CORE__FERNET_KEY
            - name: AIRFLOW__CORE__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flight-prediction-secrets
                  key: AIRFLOW__CORE__SECRET_KEY
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
