apiVersion: v1
kind: LimitRange
metadata:
  name: flight-prediction-limits
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: flight-prediction
spec:
  limits:
    # Container defaults
    - max:
        cpu: "1"
        memory: 1Gi
      min:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container
    # Pod limits
    - max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 100m
        memory: 128Mi
      type: Pod
    # PVC storage
    - max:
        storage: 50Gi
      min:
        storage: 1Gi
      type: PersistentVolumeClaim