apiVersion: v1
kind: Secret
metadata:
  name: flight-prediction-secrets
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: flight-prediction
type: Opaque
stringData:
  # MinIO credentials
  MINIO_ROOT_USER: "minio"
  MINIO_ROOT_PASSWORD: "minio123"
  MINIO_ACCESS_KEY: "minio"
  MINIO_SECRET_KEY: "minio123"
  
  # PostgreSQL (Airflow)
  POSTGRES_PASSWORD: "airflow"
  POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=100"
  
  # Airflow
  AIRFLOW__CORE__FERNET_KEY: "81HqDtibVWuz6bydy5c_BGO-HjyaDEO_0u4-8sW1Naw="
  AIRFLOW__CORE__SECRET_KEY: "change-me-in-production"
  AIRFLOW__WEBSERVER__SECRET_KEY: "change-me-in-production"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  
  # Cassandra
  CASSANDRA_PASSWORD: ""
  
  # MongoDB (optional)
  MONGODB_PASSWORD: ""
---
