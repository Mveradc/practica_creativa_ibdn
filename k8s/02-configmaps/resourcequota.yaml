apiVersion: v1
kind: ResourceQuota
metadata:
  name: flight-prediction-quota
  namespace: flight-prediction
  labels:
    app.kubernetes.io/name: flight-prediction
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
    requests.storage: 100Gi
